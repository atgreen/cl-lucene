# Project:  cl-lucene
# File:     release.yml
#
# Cut a GitHub release when a vMAJOR.MINOR.PATCH tag is pushed: use the
# matching CHANGELOG.md section as the release notes, generate a CycloneDX
# SBOM of the Lucene/OpenLDK dependency set, and attach it to the release.
# ==============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    # Least privilege: creating a release needs contents:write and nothing else.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version number
        id: get_version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # The version is interpolated into file paths and the SBOM below, so a
          # tag containing ../ would read or write an arbitrary repo file.
          # Require a plain semantic version.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Refusing tag '${GITHUB_REF_NAME}': version must be vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          # Print this version's section: from its heading to the next level-2
          # heading, dropping the heading line itself (Keep a Changelog format).
          awk -v v="## [$VERSION]" '
            index($0, v) == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > release-body.md
          # Fail loudly rather than publishing a release with an empty body.
          if [ ! -s release-body.md ]; then
            echo "::error::No CHANGELOG.md section found for version $VERSION" >&2
            echo "Add a '## [$VERSION] - YYYY-MM-DD' section before tagging." >&2
            exit 1
          fi
          echo "Extracted $(wc -l < release-body.md) lines for $VERSION"

      - name: Generate SBOM
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          # -I: ignore the environment and the script's own directory on
          # sys.path, so nothing beside an input file can be imported.
          python3 -I tools/generate-sbom.py --version "$VERSION" --output cl-lucene-sbom.cdx.json
          echo "Generated SBOM:"
          python3 -I -c "import json; d=json.load(open('cl-lucene-sbom.cdx.json')); print(d['specVersion'], len(d['components']), 'components')"

      - name: Create GitHub release
        # Pinned to a commit SHA, not the mutable v1 tag: a compromised or moved
        # tag would otherwise execute with this job's token.
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd  # v1.21.0
        with:
          tag: ${{ github.ref_name }}
          name: cl-lucene ${{ github.ref_name }}
          bodyFile: release-body.md
          artifacts: cl-lucene-sbom.cdx.json
          allowUpdates: true
